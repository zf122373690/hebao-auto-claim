<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f8fa">
  <title>权益超市自动领取</title>
  <style>
    * { box-sizing: border-box; }
    :root { font-family: Inter, "Microsoft YaHei", system-ui, sans-serif; color: #202124; background: #f7f8fa; }
    body { margin: 0; min-width: 320px; } button, input, select { font: inherit; } button { cursor: pointer; }
    .topbar { height: 64px; background: #fff; border-bottom: 1px solid #e4e7eb; display: flex; align-items: center; }
    .topbar-inner, main { width: min(960px, calc(100% - 32px)); margin: 0 auto; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 700; }
    .logo { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; color: #fff; background: #d92d20; font-weight: 800; }
    main { padding: 32px 0 56px; } .heading { margin-bottom: 24px; }
    h1 { font-size: 26px; margin: 0 0 8px; letter-spacing: 0; } h2 { margin: 0; font-size: 17px; letter-spacing: 0; }
    .subtle { margin: 0; color: #687078; font-size: 14px; }
    .panel { background: #fff; border: 1px solid #e1e4e8; border-radius: 8px; margin-bottom: 20px; }
    .panel-head { padding: 18px 20px; border-bottom: 1px solid #eceef0; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .form { padding: 20px; display: grid; grid-template-columns: 1.25fr 1fr auto; gap: 14px; align-items: end; }
    label { display: grid; gap: 7px; color: #4d545b; font-size: 13px; font-weight: 600; }
    input, select { width: 100%; height: 42px; padding: 0 12px; border: 1px solid #cbd0d6; border-radius: 6px; background: #fff; color: #202124; outline: none; }
    input:focus, select:focus { border-color: #237a57; box-shadow: 0 0 0 3px #237a5718; }
    .btn { height: 42px; border: 1px solid transparent; border-radius: 6px; padding: 0 16px; font-weight: 650; white-space: nowrap; }
    .btn-primary { color: #fff; background: #237a57; } .btn-primary:hover { background: #196747; }
    .btn-secondary { color: #30363d; background: #fff; border-color: #cbd0d6; }
    .btn-danger { color: #b42318; background: #fff; border-color: #e5b8b4; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .accounts { padding: 0 20px; }
    .account { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 14px; align-items: center; padding: 16px 0; border-bottom: 1px solid #eceef0; }
    .account:last-child { border-bottom: 0; } .phone { font-weight: 700; font-variant-numeric: tabular-nums; }
    .label { color: #737a82; margin-top: 3px; font-size: 13px; } .actions { display: flex; gap: 8px; }
    .task-products { grid-column: 1 / -1; color: #4d545b; font-size: 13px; }
    .empty { text-align: center; padding: 42px 20px; color: #737a82; }
    .log-panel { grid-column: 1 / -1; background: #f7f8fa; border-top: 1px solid #eceef0; padding: 12px; margin-top: 2px; border-radius: 6px; }
    .log-meta { color: #687078; font-size: 13px; margin-bottom: 8px; }
    .logs { max-height: 180px; overflow: auto; font: 12px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre-wrap; color: #394047; }
    .products { padding: 18px 20px 20px; border-top: 1px solid #eceef0; }
    .products-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .products-head strong { font-size: 14px; }
    .product-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .product { display: flex; align-items: flex-start; gap: 9px; padding: 12px; border: 1px solid #dfe3e7; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; }
    .product.market-product { cursor: pointer; }
    .product.market-product:hover { border-color: #237a57; background: #f7fcf9; }
    .product:has(input:checked) { border-color: #237a57; background: #f1faf5; }
    .market-login { padding: 18px 20px; display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
    .market-login-form { padding: 18px 20px; display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: end; }
    .market-login-copy { display: grid; gap: 8px; }
    .market-login-copy .status { margin: 0; }
    .market-login-copy p { margin: 0; color: #687078; font-size: 13px; }
    @media (max-width: 520px) { .market-login { grid-template-columns: 1fr; } }
    .product input { width: 17px; height: 17px; margin: 1px 0 0; accent-color: #237a57; }
    .daily-limit { margin-top: 14px; max-width: 260px; }
    .product small { display: block; color: #737a82; font-size: 12px; margin-top: 3px; font-weight: 400; }
    .status { min-height: 24px; margin: 0 20px 16px; padding: 10px 12px; border-radius: 6px; font-size: 14px; display: none; }
    .status.show { display: block; } .status.ok { color: #17603f; background: #eaf6f0; } .status.error { color: #9b241a; background: #fcecea; }
    @media (max-width: 720px) {
      .topbar-inner, main { width: min(100% - 24px, 960px); } main { padding-top: 24px; }
      .form, .account { grid-template-columns: 1fr; } .actions { display: grid; grid-template-columns: repeat(3, 1fr); }
      .actions .btn { padding: 0 10px; }
    }
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner"><div class="brand"><span class="logo">权</span>权益超市自动领取</div></div></header>
  <main>
    <div class="heading"><h1>账号与领取任务</h1><p class="subtle">添加手机号，选择权益后启动领取任务。</p></div>
    <section class="panel">
      <div class="panel-head"><h2>添加账号</h2></div>
      <form class="form" id="add-form">
        <label>手机号<input name="phone" inputmode="numeric" autocomplete="tel" maxlength="11" placeholder="请输入 11 位手机号" required pattern="1[3-9][0-9]{9}"></label>
        <label>备注<input name="label" maxlength="30" placeholder="选填"></label>
        <button class="btn btn-primary" type="submit">添加账号</button>
      </form>
      <div class="products"><div class="products-head"><strong>选择兑换商品</strong><button id="select-all" class="btn btn-secondary" type="button">全选</button><button id="select-none" class="btn btn-secondary" type="button">全不选</button></div><div id="product-list" class="product-list"><div class="empty">正在加载商品...</div></div></div>
      <div class="products"><label class="daily-limit">每日每个商品兑换次数（最多 3 次）<input id="daily-limit" type="number" min="1" max="3" value="1" required></label></div>
      <div id="form-status" class="status" role="status"></div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>商城验证码登录</h2></div>
      <form id="market-login-form" class="market-login-form"><label>手机号<select id="market-phone" name="phone" required></select></label><label>验证码<input id="market-code" name="code" inputmode="numeric" maxlength="6" placeholder="请输入短信验证码" required></label><button id="market-code-button" class="btn btn-secondary" type="button">发送验证码</button><button id="market-login-button" class="btn btn-primary" type="submit">登录商城</button></form>
      <div class="market-login"><div class="market-login-copy"><p id="market-login-status">只需要输入手机号和短信验证码。登录后点击塔斯汀、星巴克或和包商城商品，即可自动加购。</p><div id="market-orders" class="subtle">登录后可查看已领取列表。</div></div></div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>账号列表</h2><button id="refresh" class="btn btn-secondary" type="button">刷新</button></div>
      <div id="accounts" class="accounts"><div class="empty">正在加载...</div></div>
      <div class="products"><strong>商城购物车领取</strong><p class="subtle">完成商城验证码登录后，点击上方塔斯汀、星巴克或和包商品即可自动加购并发送商品验证码。</p><form id="market-cart-submit-form" class="form" style="padding:14px 0 0;grid-template-columns:1fr auto"><label>商品验证码<input name="smsCode" inputmode="numeric" maxlength="6" placeholder="收到商品短信后输入" required></label><button class="btn btn-primary" type="submit">提交商城订单</button></form></div><div id="task-status" class="status" role="status"></div>
    </section>
  </main>
  <script>
    const accountsEl = document.querySelector('#accounts');
    const formStatus = document.querySelector('#form-status');
    const taskStatus = document.querySelector('#task-status');
    const productList = document.querySelector('#product-list');
    let products = [];
    const message = (el, text, ok = true) => { el.textContent = text; el.className = `status show ${ok ? 'ok' : 'error'}`; };
    const api = async (url, options) => { const response = await fetch(url, options); const data = await response.json().catch(() => ({})); if (!response.ok) throw new Error(data.msg || `请求失败 (${response.status})`); return data; };
    const escapeHtml = value => String(value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const request = (url, data) => api(url, {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(data)});

    async function load() {
      accountsEl.innerHTML = '<div class="empty">正在加载...</div>';
      try {
        const productData = await api('/api/products');
        products = Array.isArray(productData) ? productData : productData.products;
        if (!Array.isArray(products)) throw new Error('商品接口返回格式不正确');
        const claimProducts = products.filter(p => p.channel === 'hebao' || p.marketMode === 'cart');
        productList.innerHTML = claimProducts.length ? claimProducts.map(p => `<label class="product ${p.marketMode === 'cart' ? 'market-product' : ''}" data-amount="${escapeHtml(p.amount)}"><input type="checkbox" value="${escapeHtml(p.amount)}"><span>${escapeHtml(p.price ?? (Number(p.priceCents) / 100))} 元 · ${escapeHtml(p.name)}<small>${p.marketMode === 'cart' ? '商城登录后点击此商品，自动加购并发送验证码' : `权益代码 ${escapeHtml(p.rightsCode)}`}</small></span></label>`).join('') : '<div class="empty">暂无可选商品，请刷新页面或重新部署 Worker。</div>';
        const accountData = await api('/api/accounts');
        const accounts = accountData.accounts || [];
        marketPhone.innerHTML = accounts.map(a => `<option value="${escapeHtml(a.phone)}">${escapeHtml(a.phone)} · ${escapeHtml(a.label || '未设置备注')}</option>`).join('');
        if (!accounts.length) { accountsEl.innerHTML = '<div class="empty">还没有账号，请先添加手机号。</div>'; return; }
        accountsEl.innerHTML = accounts.map(account => `<div class="account" data-phone="${escapeHtml(account.phone)}"><div><div class="phone">${escapeHtml(account.phone)}</div><div class="label">${escapeHtml(account.label || '未设置备注')}</div></div><div class="actions"><button class="btn btn-primary" data-action="start">启动</button><button class="btn btn-secondary" data-action="test-login">测试登录验证码</button><button class="btn btn-secondary" data-action="test-claim">测试兑换验证码</button><button class="btn btn-secondary" data-action="stop">停止</button><button class="btn btn-danger" data-action="delete">删除</button></div><div class="task-products" data-products>当前商品：未启动</div><div class="log-panel"><div class="log-meta" data-status>状态：空闲</div><div class="logs" data-logs>暂无日志</div></div></div>`).join('');
        pollStatuses();
      } catch (error) { accountsEl.innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`; }
    }

    let marketLoginPhone = '';
    const marketPhone = document.querySelector('#market-phone');
    const marketLoginStatus = document.querySelector('#market-login-status');
    const marketOrders = document.querySelector('#market-orders');
    const renderMarketOrders = orders => { const items = Array.isArray(orders) ? orders : []; marketOrders.innerHTML = items.length ? items.map(order => `<div>${escapeHtml(order.skuName || '商城商品')} · ${escapeHtml(order.status === 1 ? '已领取' : `状态 ${order.status ?? '-'}`)} · ${escapeHtml(order.acceptTime ? new Date(Number(order.acceptTime)).toLocaleString() : '')}</div>`).join('') : '暂无已领取记录'; };
    const loadMarketOrders = async () => { if (!marketLoginPhone) return; try { const result = await request('/api/market-orders', {phone:marketLoginPhone}); renderMarketOrders(result.orders); } catch (error) { marketOrders.textContent = error.message; } };
    const marketLoginButton = document.querySelector('#market-login-button');
    const marketCodeButton = document.querySelector('#market-code-button');
    marketCodeButton.addEventListener('click', async () => { if (!marketPhone.value) { message(taskStatus,'请先添加项目账号',false); return; } marketLoginPhone=marketPhone.value; marketCodeButton.disabled=true; try { await request('/api/market-login/code',{phone:marketLoginPhone}); marketLoginStatus.textContent='商城登录验证码已发送，请查收短信'; } catch(error) { marketLoginStatus.textContent=error.message; } finally { marketCodeButton.disabled=false; } });
    document.querySelector('#market-login-form').addEventListener('submit', async event => { event.preventDefault(); if (!marketPhone.value) return; marketLoginPhone=marketPhone.value; marketLoginButton.disabled=true; try { const result=await request('/api/market-login/login',{phone:marketLoginPhone,code:document.querySelector('#market-code').value}); marketLoginStatus.textContent=`商城已登录：${result.mobile || '当前账号'}，现在点击商城商品即可自动加购`; marketLoginButton.textContent='已登录'; await loadMarketOrders(); } catch(error) { marketLoginStatus.textContent=error.message; } finally { marketLoginButton.disabled=false; } });
    productList.addEventListener('click', async event => { const card=event.target.closest('.market-product'); if (!card || event.target.closest('input')) return; const amount=card.dataset.amount; if (!marketLoginPhone) { message(taskStatus,'请先在“商城网页登录”中选择项目账号并完成短信验证码登录',false); return; } card.style.pointerEvents='none'; try { const result=await request('/api/market-cart/send',{phone:marketLoginPhone,amount}); card.querySelector('input').checked=true; message(taskStatus,result.msg||'商城验证码已发送，请查收短信'); } catch(error) { message(taskStatus,error.message,false); } finally { card.style.pointerEvents=''; } });
    document.querySelector('#market-cart-submit-form').addEventListener('submit', async event => { event.preventDefault(); const form=event.currentTarget, submit=form.querySelector('button'); submit.disabled=true; try { const result=await request('/api/market-cart/submit',{phone:marketLoginPhone,smsCode:form.smsCode.value}); message(taskStatus,result.msg||'商城订单已提交'); } catch(error) { message(taskStatus,error.message,false); } finally { submit.disabled=false; } });
    document.querySelector('#add-form').addEventListener('submit', async event => {
      event.preventDefault(); const form = event.currentTarget; const submit = form.querySelector('button'); submit.disabled = true;
      try { const phone=form.phone.value; await request('/api/accounts', {phone, label:form.label.value}); message(formStatus, '账号已添加，请在账号列表中启动任务'); form.reset(); await load(); }
      catch (error) { message(formStatus, error.message, false); } finally { submit.disabled = false; }
    });
    accountsEl.addEventListener('click', async event => {
      const button = event.target.closest('button[data-action]'); if (!button) return;
      const row = button.closest('.account'); const phone = row.dataset.phone; const action = button.dataset.action; button.disabled = true;
      try {
        if (action === 'delete') { await request('/api/accounts', {phone, action:'delete'}); message(taskStatus, `${phone} 已删除`); await load(); }
        else { const amounts=[...productList.querySelectorAll('input:checked')].map(input=>input.value); const repeat=Math.max(1,Math.min(3,Number(document.querySelector('#daily-limit').value)||1)); if (action === 'start' && !amounts.length) throw new Error('请至少选择一个兑换商品'); const endpoint=action==='test-login'?'/api/test-login':action==='test-claim'?'/api/test-claim':`/api/${action}`; const data=action==='test-claim'?{phone,amount:amounts[0]||'hebao-1'}:{phone,amounts,repeat}; const result = await request(endpoint, data); message(taskStatus, result.msg || '操作已发送'); await pollStatuses(); }
      } catch (error) { message(taskStatus, error.message, false); } finally { button.disabled = false; }
    });
    document.querySelector('#refresh').addEventListener('click', load); load();
    document.querySelector('#select-all').addEventListener('click', () => productList.querySelectorAll('input').forEach(input => { input.checked = true; }));
    document.querySelector('#select-none').addEventListener('click', () => productList.querySelectorAll('input').forEach(input => { input.checked = false; }));
    async function pollStatuses() { for (const row of accountsEl.querySelectorAll('.account')) { try { const data=await api(`/api/status?phone=${encodeURIComponent(row.dataset.phone)}`); row.querySelector('[data-status]').textContent=`状态：${data.state || 'idle'}${data.error ? ` · ${data.error}` : ''}`; const amounts=[...new Set(data.payload?.amounts || [])]; row.querySelector('[data-products]').textContent=amounts.length ? `当前商品：${amounts.join(' 元、')} 元` : '当前商品：未启动'; const logs=data.logs || []; row.querySelector('[data-logs]').textContent=logs.length ? logs.map(item=>`${new Date(item.time).toLocaleTimeString()}  ${item.text}`).join('\n') : '暂无日志'; } catch {} } }
    setInterval(pollStatuses, 2000);
  </script>
</body>
</html>
